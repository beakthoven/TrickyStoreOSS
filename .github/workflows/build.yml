name: Build

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: keymint-resolver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/keymint-hal-version'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Isolate Android 12+ resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/io/github/beakthoven/TrickyStoreOSS/AndroidUtils.kt")
          text = path.read_text()
          for line in (
              "import android.hardware.security.keymint.IKeyMintDevice\n",
              "import android.hardware.security.keymint.SecurityLevel\n",
              "import android.os.ServiceManager\n",
              "import android.security.compat.IKeystoreCompatService\n",
          ):
              if text.count(line) != 1:
                  raise SystemExit(f"AndroidUtils.kt: expected one import: {line.strip()}")
              text = text.replace(line, "", 1)

          start = text.index("    data class AttestationVersions")
          end = text.index("    fun String.convertPatchLevel", start)
          replacement = """    data class AttestationVersions(val attestation: Int, val keymaster: Int)

              private val resolvedVersions = ConcurrentHashMap<Int, AttestationVersions>()

              private fun cachedTeeVersions(securityLevel: Int): AttestationVersions? {
                  // android.hardware.security.keymint.SecurityLevel.TRUSTED_ENVIRONMENT
                  if (securityLevel != 1) return null
                  val data = CachedAttestData ?: return null
                  val attestation = data.attestVersion ?: return null
                  val keymaster = data.keymasterVersion ?: return null
                  return AttestationVersions(attestation, keymaster)
              }

              private fun keymasterVersionForAttestation(attestationVersion: Int): Int =
                  when (attestationVersion) {
                      1 -> 2
                      2 -> 3
                      3 -> 4
                      4 -> 41
                      else -> attestationVersion
                  }

              fun attestationVersions(securityLevel: Int): AttestationVersions {
                  resolvedVersions[securityLevel]?.let { return it }

                  val platformVersions =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          KeyMintVersionResolver.resolve(securityLevel)
                      } else {
                          null
                      }
                  val exact = platformVersions ?: cachedTeeVersions(securityLevel)
                  if (exact != null) {
                      resolvedVersions.putIfAbsent(securityLevel, exact)
                      return resolvedVersions[securityLevel] ?: exact
                  }

                  val attestation = attestVersionMap[Build.VERSION.SDK_INT] ?: 500
                  return AttestationVersions(attestation, keymasterVersionForAttestation(attestation))
              }

          """
          path.write_text(text[:start] + replacement + text[end:])

          resolver = Path("app/src/main/java/io/github/beakthoven/TrickyStoreOSS/KeyMintVersionResolver.kt")
          resolver.write_text("""/*
           * Copyright 2026 Dakkshesh <beakthoven@gmail.com>
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          package io.github.beakthoven.TrickyStoreOSS

          import android.hardware.security.keymint.IKeyMintDevice
          import android.hardware.security.keymint.SecurityLevel
          import android.os.ServiceManager
          import android.security.compat.IKeystoreCompatService
          import android.util.Log
          import io.github.beakthoven.TrickyStoreOSS.logging.TAG

          /** Resolves versions from Android 12+ native KeyMint and legacy Keymaster backends. */
          internal object KeyMintVersionResolver {
              fun resolve(securityLevel: Int): AndroidUtils.AttestationVersions? =
                  nativeKeyMintVersions(securityLevel) ?: compatKeymasterVersions(securityLevel)

              private fun keyMintInstance(securityLevel: Int): String? =
                  when (securityLevel) {
                      SecurityLevel.TRUSTED_ENVIRONMENT -> "default"
                      SecurityLevel.STRONGBOX -> "strongbox"
                      else -> null
                  }

              private fun nativeKeyMintVersions(securityLevel: Int): AndroidUtils.AttestationVersions? {
                  val instance = keyMintInstance(securityLevel) ?: return null
                  val serviceName = "${IKeyMintDevice.DESCRIPTOR}/$instance"
                  val binder = ServiceManager.checkService(serviceName) ?: return null

                  return runCatching {
                          val keyMint = IKeyMintDevice.Stub.asInterface(binder)
                          val interfaceVersion = keyMint.interfaceVersion
                          require(interfaceVersion > 0) { "Invalid KeyMint interface version: $interfaceVersion" }
                          val version = Math.multiplyExact(interfaceVersion, 100)
                          AndroidUtils.AttestationVersions(version, version)
                      }
                      .onSuccess { versions -> Log.i(TAG, "Resolved $serviceName versions: $versions") }
                      .onFailure { Log.w(TAG, "Failed to query $serviceName interface version", it) }
                      .getOrNull()
              }

              private fun legacyKeymasterVersions(versionNumber: Int): AndroidUtils.AttestationVersions? =
                  when (versionNumber) {
                      20 -> AndroidUtils.AttestationVersions(1, 2)
                      30 -> AndroidUtils.AttestationVersions(2, 3)
                      40 -> AndroidUtils.AttestationVersions(3, 4)
                      41 -> AndroidUtils.AttestationVersions(4, 41)
                      else -> null
                  }

              private fun compatKeymasterVersions(securityLevel: Int): AndroidUtils.AttestationVersions? {
                  if (keyMintInstance(securityLevel) == null) return null
                  val serviceName = "android.security.compat"
                  val binder = ServiceManager.checkService(serviceName) ?: return null

                  return runCatching {
                          val compat = IKeystoreCompatService.Stub.asInterface(binder)
                          val keyMint = compat.getKeyMintDevice(securityLevel)
                          val hardwareInfo = keyMint.hardwareInfo
                          require(hardwareInfo.securityLevel == securityLevel) {
                              "Compat KeyMint security level ${hardwareInfo.securityLevel}, requested $securityLevel"
                          }
                          legacyKeymasterVersions(hardwareInfo.versionNumber)
                              ?: error("Unsupported legacy Keymaster version: ${hardwareInfo.versionNumber}")
                      }
                      .onSuccess { versions ->
                          Log.i(TAG, "Resolved $serviceName level=$securityLevel versions: $versions")
                      }
                      .onFailure { Log.w(TAG, "Failed to query $serviceName level=$securityLevel", it) }
                      .getOrNull()
              }
          }
          """)
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/build.yml
          git diff --check
          git diff --stat

      - name: Commit resolver isolation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: isolate API 31 KeyMint resolver"
          git push origin HEAD:${{ github.head_ref }}
