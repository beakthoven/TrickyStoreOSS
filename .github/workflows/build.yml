name: Build

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: keymint-resolver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/keymint-hal-version'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          android_utils = Path("app/src/main/java/io/github/beakthoven/TrickyStoreOSS/AndroidUtils.kt")
          replace_once(
              android_utils,
              """import android.hardware.security.keymint.IKeyMintDevice
          import android.os.Build
          import android.os.ServiceManager
          import android.os.SystemProperties
          """,
              """import android.os.Build
          import android.os.SystemProperties
          """,
          )
          replace_once(
              android_utils,
              """import java.security.SecureRandom
          import java.time.LocalDate
          """,
              """import java.security.SecureRandom
          import java.time.LocalDate
          import java.util.concurrent.ConcurrentHashMap
          """,
          )

          old_resolver = """    @Volatile private var cachedKeyMintAttestVersion: Int? = null

              private fun getKeyMintAttestVersion(): Int? {
                  cachedKeyMintAttestVersion?.let { return it }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return null

                  val serviceName = "${IKeyMintDevice.DESCRIPTOR}/default"
                  val binder = ServiceManager.checkService(serviceName) ?: return null
                  return runCatching {
                          val keyMint = IKeyMintDevice.Stub.asInterface(binder)
                          val interfaceVersion = keyMint.interfaceVersion
                          require(interfaceVersion > 0) { "Invalid KeyMint interface version: $interfaceVersion" }
                          interfaceVersion * 100
                      }
                      .onSuccess { version ->
                          cachedKeyMintAttestVersion = version
                          Log.i(TAG, "Using KeyMint HAL version from $serviceName: $version")
                      }
                      .onFailure { Log.w(TAG, "Failed to query KeyMint HAL version from $serviceName", it) }
                      .getOrNull()
              }

              val attestVersion: Int
                  get() =
                      CachedAttestData?.attestVersion
                          ?: getKeyMintAttestVersion()
                          ?: attestVersionMap[Build.VERSION.SDK_INT]
                          ?: 500

              val keymasterVersion: Int
                  get() = CachedAttestData?.keymasterVersion ?: if (attestVersion == 4) 41 else attestVersion
          """

          new_resolver = """    data class AttestationVersions(val attestation: Int, val keymaster: Int)

              private val resolvedVersions = ConcurrentHashMap<Int, AttestationVersions>()

              private fun cachedTeeVersions(securityLevel: Int): AttestationVersions? {
                  // android.hardware.security.keymint.SecurityLevel.TRUSTED_ENVIRONMENT
                  if (securityLevel != 1) return null
                  val data = CachedAttestData ?: return null
                  val attestation = data.attestVersion ?: return null
                  val keymaster = data.keymasterVersion ?: return null
                  return AttestationVersions(attestation, keymaster)
              }

              private fun keymasterVersionForAttestation(attestationVersion: Int): Int =
                  when (attestationVersion) {
                      1 -> 2
                      2 -> 3
                      3 -> 4
                      4 -> 41
                      else -> attestationVersion
                  }

              fun attestationVersions(securityLevel: Int): AttestationVersions {
                  resolvedVersions[securityLevel]?.let { return it }

                  val platformVersions =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          KeyMintVersionResolver.resolve(securityLevel)
                      } else {
                          null
                      }
                  val exact = platformVersions ?: cachedTeeVersions(securityLevel)
                  if (exact != null) {
                      resolvedVersions.putIfAbsent(securityLevel, exact)
                      return resolvedVersions[securityLevel] ?: exact
                  }

                  val attestation = attestVersionMap[Build.VERSION.SDK_INT] ?: 500
                  return AttestationVersions(attestation, keymasterVersionForAttestation(attestation))
              }
          """
          replace_once(android_utils, old_resolver, new_resolver)

          resolver = Path("app/src/main/java/io/github/beakthoven/TrickyStoreOSS/KeyMintVersionResolver.kt")
          resolver.write_text("""/*
           * Copyright 2026 Dakkshesh <beakthoven@gmail.com>
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          package io.github.beakthoven.TrickyStoreOSS

          import android.hardware.security.keymint.IKeyMintDevice
          import android.hardware.security.keymint.SecurityLevel
          import android.os.ServiceManager
          import android.security.compat.IKeystoreCompatService
          import android.util.Log
          import io.github.beakthoven.TrickyStoreOSS.logging.TAG

          /** Android 12+ backend resolver, isolated so pre-KeyMint releases never load these classes. */
          internal object KeyMintVersionResolver {
              fun resolve(securityLevel: Int): AndroidUtils.AttestationVersions? =
                  nativeKeyMintVersions(securityLevel) ?: compatKeymasterVersions(securityLevel)

              private fun keyMintInstance(securityLevel: Int): String? =
                  when (securityLevel) {
                      SecurityLevel.TRUSTED_ENVIRONMENT -> "default"
                      SecurityLevel.STRONGBOX -> "strongbox"
                      else -> null
                  }

              private fun nativeKeyMintVersions(securityLevel: Int): AndroidUtils.AttestationVersions? {
                  val instance = keyMintInstance(securityLevel) ?: return null
                  val serviceName = "${IKeyMintDevice.DESCRIPTOR}/$instance"
                  val binder = ServiceManager.checkService(serviceName) ?: return null

                  return runCatching {
                          val keyMint = IKeyMintDevice.Stub.asInterface(binder)
                          val interfaceVersion = keyMint.interfaceVersion
                          require(interfaceVersion > 0) { "Invalid KeyMint interface version: $interfaceVersion" }
                          val version = Math.multiplyExact(interfaceVersion, 100)
                          AndroidUtils.AttestationVersions(version, version)
                      }
                      .onSuccess { versions -> Log.i(TAG, "Resolved $serviceName versions: $versions") }
                      .onFailure { Log.w(TAG, "Failed to query $serviceName interface version", it) }
                      .getOrNull()
              }

              private fun legacyKeymasterVersions(versionNumber: Int): AndroidUtils.AttestationVersions? =
                  when (versionNumber) {
                      20 -> AndroidUtils.AttestationVersions(1, 2)
                      30 -> AndroidUtils.AttestationVersions(2, 3)
                      40 -> AndroidUtils.AttestationVersions(3, 4)
                      41 -> AndroidUtils.AttestationVersions(4, 41)
                      else -> null
                  }

              private fun compatKeymasterVersions(securityLevel: Int): AndroidUtils.AttestationVersions? {
                  if (keyMintInstance(securityLevel) == null) return null
                  val serviceName = "android.security.compat"
                  val binder = ServiceManager.checkService(serviceName) ?: return null

                  return runCatching {
                          val compat = IKeystoreCompatService.Stub.asInterface(binder)
                          val keyMint = compat.getKeyMintDevice(securityLevel)
                          val hardwareInfo = keyMint.hardwareInfo
                          require(hardwareInfo.securityLevel == securityLevel) {
                              "Compat KeyMint security level ${hardwareInfo.securityLevel}, requested $securityLevel"
                          }
                          legacyKeymasterVersions(hardwareInfo.versionNumber)
                              ?: error("Unsupported legacy Keymaster version: ${hardwareInfo.versionNumber}")
                      }
                      .onSuccess { versions ->
                          Log.i(TAG, "Resolved $serviceName level=$securityLevel versions: $versions")
                      }
                      .onFailure { Log.w(TAG, "Failed to query $serviceName level=$securityLevel", it) }
                      .getOrNull()
              }
          }
          """)

          cert_gen = Path("app/src/main/java/io/github/beakthoven/TrickyStoreOSS/CertificateGen.kt")
          replace_once(
              cert_gen,
              """    private fun buildAttestExtension(params: KeyGenParameters, uid: Int, securityLevel: Int = 1): Extension {
                  val key = AndroidUtils.bootKey
          """,
              """    private fun buildAttestExtension(params: KeyGenParameters, uid: Int, securityLevel: Int = 1): Extension {
                  val versions = AndroidUtils.attestationVersions(securityLevel)
                  val attestationVersion = versions.attestation
                  val keymasterVersion = versions.keymaster
                  val key = AndroidUtils.bootKey
          """,
          )
          cert_text = cert_gen.read_text()
          attest_uses = cert_text.count("AndroidUtils.attestVersion")
          keymaster_uses = cert_text.count("AndroidUtils.keymasterVersion")
          if attest_uses != 4 or keymaster_uses != 1:
              raise SystemExit(
                  f"CertificateGen.kt: unexpected version references: "
                  f"attest={attest_uses}, keymaster={keymaster_uses}"
              )
          cert_gen.write_text(
              cert_text.replace("AndroidUtils.attestVersion", "attestationVersion")
                  .replace("AndroidUtils.keymasterVersion", "keymasterVersion")
          )

          keymint_stub = Path("stub/src/main/java/android/hardware/security/keymint/IKeyMintDevice.java")
          replace_once(
              keymint_stub,
              """    int getInterfaceVersion() throws RemoteException;
          """,
              """    KeyMintHardwareInfo getHardwareInfo() throws RemoteException;

              int getInterfaceVersion() throws RemoteException;
          """,
          )

          compat_stub = Path("stub/src/main/java/android/security/compat/IKeystoreCompatService.java")
          compat_stub.parent.mkdir(parents=True, exist_ok=True)
          compat_stub.write_text("""/*
           * Copyright 2026 Dakkshesh <beakthoven@gmail.com>
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          package android.security.compat;

          import android.hardware.security.keymint.IKeyMintDevice;
          import android.os.IBinder;
          import android.os.IInterface;
          import android.os.RemoteException;

          /** Compile-only stub for the keystore2 legacy Keymaster compatibility service. */
          public interface IKeystoreCompatService extends IInterface {
              IKeyMintDevice getKeyMintDevice(int securityLevel) throws RemoteException;

              abstract class Stub {
                  public static IKeystoreCompatService asInterface(IBinder binder) {
                      throw new UnsupportedOperationException("");
                  }
              }
          }
          """)
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/build.yml
          git diff --check
          git diff --stat

      - name: Commit verified resolver
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve attestation versions per security level"
          git push origin HEAD:${{ github.head_ref }}
