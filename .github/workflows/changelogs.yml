name: Publish Changelog

on:
  release:
    types: [published, edited]

jobs:
  generate-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch release metadata
        id: release
        env:
          ASSETS: ${{ toJson(github.event.release.assets) }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("Release.zip")) | .browser_download_url' | head -n1)
          if [ -z "$URL" ]; then
            echo "::error::Missing Release.zip asset in release."
            echo "$ASSETS" | jq -r '.[].name'
            exit 1
          fi
          echo "zip_url=$URL" >> "$GITHUB_OUTPUT"

          # Read versionCode from the shipped module.prop so it never drifts
          # from the value baked in at build time.
          curl -fsSL "$URL" -o release.zip
          VERSION_CODE=$(unzip -p release.zip module.prop | sed -n 's/^versionCode=//p')
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionCode from release zip module.prop"
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Checkout changelog branch
        uses: actions/checkout@v7
        with:
          ref: changelog
          path: changelog-branch

      - name: Write changelog and JSON
        env:
          BODY: ${{ github.event.release.body }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          URL: ${{ steps.release.outputs.zip_url }}
          REPO: ${{ github.repository }}
        run: |
          cd changelog-branch

          printf '%s\n' "$BODY" > changelog.md

          CHANGELOG_URL="https://raw.githubusercontent.com/${REPO}/changelog/changelog.md"
          jq -n \
            --arg v "$TAG" \
            --argjson vc "$VERSION_CODE" \
            --arg z "$URL" \
            --arg c "$CHANGELOG_URL" \
            '{version:$v, versionCode:$vc, zipUrl:$z, changelog:$c}' > update.json

      - name: Commit and push updates
        run: |
          cd changelog-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add changelog.md update.json
          git commit -m "Update metadata for ${{ steps.release.outputs.tag }}"
          git push origin changelog -f
